<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davis Weather — 14 Day Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-day: #b8d4f0; --sky-rain: #8fa8c8; --sky-night: #0d1b3e; --sky-clear: #e8f4fd;
    --ink: #1a1a2e; --ink-soft: #3d3d5c; --ink-muted: #7a7a9a; --accent: #e8650a;
    --accent-soft: #f5a05a; --card-bg: rgba(255,255,255,0.55); --card-border: rgba(255,255,255,0.7);
  }

  body { font-family: 'DM Mono', monospace; background: var(--sky-rain); min-height: 100vh; color: var(--ink); overflow-x: hidden; transition: background 1.2s ease; }
  .sky-bg { position: fixed; inset: 0; z-index: 0; background: linear-gradient(170deg, #6a93c4 0%, #b8d4f0 50%, #d4e8f5 100%); transition: all 1.2s ease; }
  .sky-bg.clear { background: linear-gradient(170deg, #2980b9 0%, #a8d8f0 45%, #e8f6fd 100%); }
  .sky-bg.rainy { background: linear-gradient(170deg, #4a6080 0%, #7a98b8 50%, #a0b8d0 100%); }
  .sky-bg.cloudy { background: linear-gradient(170deg, #6a7a90 0%, #98afc4 50%, #bcd0e4 100%); }

  .clouds { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .cloud { position: absolute; background: rgba(255,255,255,0.6); border-radius: 50px; animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: rgba(255,255,255,0.6); border-radius: 50%; }
  .cloud::before { width: 60%; height: 160%; top: -40%; left: 20%; }
  .cloud::after  { width: 40%; height: 130%; top: -25%; left: 50%; }
  .cloud-1 { width: 200px; height: 50px; top: 8%;  left: -220px; animation-duration: 60s; animation-delay: -10s; opacity: 0.7; }
  .cloud-2 { width: 140px; height: 35px; top: 18%; left: -160px; animation-duration: 80s; animation-delay: -30s; opacity: 0.5; }
  .cloud-3 { width: 260px; height: 65px; top: 5%;  left: -280px; animation-duration: 50s; animation-delay: -20s; opacity: 0.4; }
  .cloud-4 { width: 180px; height: 45px; top: 28%; left: -200px; animation-duration: 70s; animation-delay: -50s; opacity: 0.6; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 400px)); } }

  .rain-container { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 1s; }
  .rain-container.active { opacity: 1; }
  .raindrop { position: absolute; width: 1px; background: linear-gradient(to bottom, transparent, rgba(150,190,230,0.6)); animation: fall linear infinite; }
  @keyframes fall { from { transform: translateY(-100px); } to { transform: translateY(100vh); } }

  .app { position: relative; z-index: 10; max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; min-height: 100vh; }
  
  .loading-overlay { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(184, 212, 240, 0.85); backdrop-filter: blur(8px); gap: 16px; transition: opacity 0.5s; }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner { width: 36px; height: 36px; border: 2px solid rgba(26,26,46,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem; }
  .city-name { font-family: 'DM Serif Display', serif; font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1; }
  .city-name em { font-style: italic; color: var(--accent); }
  .big-temp { font-family: 'DM Serif Display', serif; font-size: clamp(3rem, 8vw, 5rem); line-height: 1; }
  .big-temp sup { font-size: 0.4em; vertical-align: super; }

  /* Navigation and Scrollable Row */
  .nav-container { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
  .nav-btn { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 4px; padding: 6px 12px; cursor: pointer; color: var(--ink); font-family: 'DM Mono'; }
  
  .days-row { 
    display: flex; overflow-x: auto; gap: 10px; padding-bottom: 15px; margin-bottom: 2rem; 
    scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; 
  }
  .days-row::-webkit-scrollbar { display: none; }
  
  .day-card { 
    flex: 0 0 115px; background: var(--card-bg); border: 1px solid var(--card-border); 
    border-radius: 4px; padding: 16px 12px; cursor: pointer; transition: all 0.2s; 
  }
  .day-card.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .day-card.active .day-label, .day-card.active .day-date { color: rgba(255,255,255,0.7); }
  .day-label { font-size: 10px; text-transform: uppercase; margin-bottom: 8px; color: var(--ink-muted); }
  .day-icon { font-size: 22px; margin-bottom: 8px; display: block; }
  .day-high { font-family: 'DM Serif Display', serif; font-size: 1.5rem; }

  .detail-panel { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 4px; padding: 1.5rem; backdrop-filter: blur(12px); }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 1.5rem 0; }
  .stat-val { font-family: 'DM Serif Display', serif; font-size: 1.6rem; }
  .chart-wrap { position: relative; width: 100%; height: 180px; }
  .footer { text-align: center; font-size: 10px; color: var(--ink-muted); margin-top: 2rem; text-transform: uppercase; }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading 14-Day Forecast...</div>
</div>

<div class="sky-bg" id="skyBg"></div>
<div class="clouds">
  <div class="cloud cloud-1"></div><div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div><div class="cloud cloud-4"></div>
</div>
<div class="rain-container" id="rainContainer"></div>

<div class="app">
  <div class="header">
    <div class="location-block">
      <h1 class="city-name">Da<em>vis</em>,<br>California</h1>
      <p style="font-size: 11px; color: var(--ink-muted); margin-top: 6px;">38.5°N · YOLO COUNTY</p>
    </div>
    <div style="text-align: right;">
      <div class="big-temp" id="bigTemp">—<sup>°F</sup></div>
      <div id="currentCond" style="font-size: 11px; text-transform: uppercase;">Fetching...</div>
    </div>
  </div>

  <div class="nav-container">
    <button class="nav-btn" onclick="scrollDays(-240)">←</button>
    <button class="nav-btn" onclick="scrollDays(240)">→</button>
  </div>
  <div class="days-row" id="daysRow"></div>
  <div class="detail-panel" id="detailPanel"></div>
  <div class="footer" id="footer">Weather Data · Open-Meteo API</div>
</div>

<script>
const LAT = 38.5449; const LON = -121.7405;
let forecastDays = []; let hourlyPeriods = []; let activeDay = 0; let chart = null;

// Rain Effect
const rainContainer = document.getElementById('rainContainer');
for (let i = 0; i < 60; i++) {
  const d = document.createElement('div'); d.className = 'raindrop';
  d.style.cssText = `left:${Math.random()*100}%;height:${12+Math.random()*20}px;animation-duration:${0.6+Math.random()*0.8}s;animation-delay:${-Math.random()*2}s;top:-5%`;
  rainContainer.appendChild(d);
}

function scrollDays(amount) { document.getElementById('daysRow').scrollBy({ left: amount, behavior: 'smooth' }); }

const condIcon = c => {
  c = c.toLowerCase();
  if (/rain|shower|drizzle/.test(c)) return '🌧️';
  if (/thunder/.test(c)) return '⛈️';
  if (/cloudy|overcast/.test(c)) return '☁️';
  if (/partly/.test(c)) return '⛅';
  return '☀️';
};

const skyClass = c => {
  c = c.toLowerCase();
  if (/rain|shower|thunder/.test(c)) return 'rainy';
  if (/cloud|overcast/.test(c)) return 'cloudy';
  return 'clear';
};

async function fetchWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&hourly=temperature_2m,precipitation_probability&temperature_unit=fahrenheit&precipitation_unit=inch&timezone=America%2FLos_Angeles&forecast_days=14`;
    
    const weatherDesc = { 0: "Clear sky", 1: "Mainly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 61: "Light rain", 63: "Rain", 80: "Showers", 95: "Thunderstorm" };

    const res = await fetch(url);
    const data = await res.json();

    forecastDays = data.daily.time.map((time, i) => {
      const dObj = new Date(time + "T00:00:00");
      return {
        day: dObj.toLocaleDateString("en-US", { weekday: "short" }),
        date: dObj.toLocaleDateString("en-US", { month: "short", day: "numeric" }),
        startTime: time,
        high: Math.round(data.daily.temperature_2m_max[i]),
        low: Math.round(data.daily.temperature_2m_min[i]),
        precip: data.daily.precipitation_probability_max[i] || 0,
        cond: weatherDesc[data.daily.weathercode[i]] || "Cloudy"
      };
    });

    hourlyPeriods = data.hourly.time.map((time, i) => ({
      startTime: time, temperature: data.hourly.temperature_2m[i], precip: data.hourly.precipitation_probability[i]
    }));

    document.getElementById('bigTemp').innerHTML = `${forecastDays[0].high}<sup>°F</sup>`;
    document.getElementById('currentCond').textContent = forecastDays[0].cond;
    renderAll();
  } catch (e) { console.error(e); }
  finally { document.getElementById('loadingOverlay').classList.add('hidden'); }
}

function renderDays() {
  const row = document.getElementById('daysRow'); row.innerHTML = '';
  forecastDays.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'day-card' + (i === activeDay ? ' active' : '');
    card.innerHTML = `<div class="day-label">${d.day}</div><span class="day-icon">${condIcon(d.cond)}</span><div class="day-high">${d.high}<sup>°</sup></div><div class="day-date">${d.date}</div><div style="font-size:9px;margin-top:5px;">${d.precip}% Rain</div>`;
    card.onclick = () => { activeDay = i; renderAll(); };
    row.appendChild(card);
  });
}

function renderDetail() {
  const d = forecastDays[activeDay];
  document.getElementById('skyBg').className = 'sky-bg ' + skyClass(d.cond);
  rainContainer.classList.toggle('active', d.precip > 30);

  const dayHours = hourlyPeriods.filter(h => h.startTime.startsWith(d.startTime));
  const targetHours = [6, 9, 12, 15, 18, 21];
  const chartData = targetHours.map(h => dayHours.find(p => new Date(p.startTime).getHours() === h)).filter(Boolean);

  document.getElementById('detailPanel').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <h2 style="font-family:'DM Serif Display';">${d.day}, ${d.date}</h2>
      <span style="font-size:10px;text-transform:uppercase;">${d.cond}</span>
    </div>
    <div class="stats-row">
      <div><p style="font-size:10px;color:var(--ink-muted);">HIGH/LOW</p><div class="stat-val">${d.high}°<span style="font-size:12px;margin-left:5px;">${d.low}°</span></div></div>
      <div><p style="font-size:10px;color:var(--ink-muted);">PRECIP</p><div class="stat-val">${d.precip}%</div></div>
      <div><p style="font-size:10px;color:var(--ink-muted);">WIND</p><div class="stat-val">8<span style="font-size:11px;margin-left:4px;">mph</span></div></div>
    </div>
    <div class="chart-wrap"><canvas id="tempChart"></canvas></div>`;

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('tempChart'), {
    type: 'line',
    data: {
      labels: chartData.map(h => new Date(h.startTime).toLocaleTimeString([], {hour:'numeric'})),
      datasets: [{ data: chartData.map(h => h.temperature), borderColor: '#e8650a', fill: true, tension: 0.4, backgroundColor: 'rgba(232,101,10,0.1)' }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { font: { family: 'DM Mono', size: 10 } } } } }
  });
}

function renderAll() { renderDays(); renderDetail(); }
fetchWeather();
</script>
</body>
</html>
