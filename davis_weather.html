<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davis Weather</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-day: #b8d4f0;
    --sky-rain: #8fa8c8;
    --sky-night: #0d1b3e;
    --sky-clear: #e8f4fd;
    --ink: #1a1a2e;
    --ink-soft: #3d3d5c;
    --ink-muted: #7a7a9a;
    --accent: #e8650a;
    --accent-soft: #f5a05a;
    --card-bg: rgba(255,255,255,0.55);
    --card-border: rgba(255,255,255,0.7);
    --glass: rgba(255,255,255,0.3);
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--sky-rain);
    min-height: 100vh;
    color: var(--ink);
    overflow-x: hidden;
    transition: background 1.2s ease;
  }

  .sky-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: linear-gradient(170deg, #6a93c4 0%, #b8d4f0 50%, #d4e8f5 100%);
    transition: all 1.2s ease;
  }

  .sky-bg.clear { background: linear-gradient(170deg, #2980b9 0%, #a8d8f0 45%, #e8f6fd 100%); }
  .sky-bg.rainy { background: linear-gradient(170deg, #4a6080 0%, #7a98b8 50%, #a0b8d0 100%); }
  .sky-bg.cloudy { background: linear-gradient(170deg, #6a7a90 0%, #98afc4 50%, #bcd0e4 100%); }

  .clouds {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }

  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.6);
    border-radius: 50px;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.6);
    border-radius: 50%;
  }
  .cloud::before { width: 60%; height: 160%; top: -40%; left: 20%; }
  .cloud::after  { width: 40%; height: 130%; top: -25%; left: 50%; }

  .cloud-1 { width: 200px; height: 50px; top: 8%;  left: -220px; animation-duration: 60s; animation-delay: -10s; opacity: 0.7; }
  .cloud-2 { width: 140px; height: 35px; top: 18%; left: -160px; animation-duration: 80s; animation-delay: -30s; opacity: 0.5; }
  .cloud-3 { width: 260px; height: 65px; top: 5%;  left: -280px; animation-duration: 50s; animation-delay: -20s; opacity: 0.4; }
  .cloud-4 { width: 180px; height: 45px; top: 28%; left: -200px; animation-duration: 70s; animation-delay: -50s; opacity: 0.6; }

  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 400px)); } }

  .rain-container {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s;
  }
  .rain-container.active { opacity: 1; }
  .raindrop {
    position: absolute;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(150,190,230,0.6));
    animation: fall linear infinite;
    border-radius: 1px;
  }
  @keyframes fall { from { transform: translateY(-100px); } to { transform: translateY(100vh); } }

  .app {
    position: relative;
    z-index: 10;
    max-width: 860px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 3rem;
    min-height: 100vh;
  }

  /* Loading state */
  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(184, 212, 240, 0.85);
    backdrop-filter: blur(8px);
    gap: 16px;
    transition: opacity 0.5s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 36px; height: 36px;
    border: 2px solid rgba(26,26,46,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }

  .error-banner {
    display: none;
    background: rgba(232,101,10,0.1);
    border: 1px solid rgba(232,101,10,0.3);
    border-radius: 4px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 1.5rem;
    letter-spacing: 0.05em;
  }
  .error-banner.visible { display: block; }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 2.5rem;
    animation: fadeUp 0.8s ease both;
  }

  .location-block {}
  .city-name {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .city-name em { font-style: italic; color: var(--accent); }
  .subtitle { font-size: 11px; color: var(--ink-muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 6px; }

  .current-block { text-align: right; }
  .big-temp {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(3rem, 8vw, 5rem);
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.03em;
  }
  .big-temp sup { font-size: 0.4em; vertical-align: super; }
  .current-cond { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }

  .days-row {
    display: grid;
    grid-template-columns: repeat(7, minmax(0,1fr));
    gap: 10px;
    margin-bottom: 2rem;
    animation: fadeUp 0.8s ease 0.25s both;
  }

  .day-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 16px 12px;
    backdrop-filter: blur(12px);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .day-card:hover { background: rgba(255,255,255,0.7); transform: translateY(-2px); }
  .day-card.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .day-card.active .day-label,
  .day-card.active .day-date,
  .day-card.active .day-precip { color: rgba(255,255,255,0.7); }
  .day-card.active .day-high { color: #fff; }
  .day-card.active .day-icon { filter: brightness(10); }

  .day-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; }
  .day-icon { font-size: 22px; margin-bottom: 8px; display: block; line-height: 1; }
  .day-high { font-family: 'DM Serif Display', serif; font-size: 1.5rem; line-height: 1; color: var(--ink); }
  .day-high sup { font-size: 0.5em; vertical-align: super; font-family: 'DM Mono', monospace; font-weight: 300; }
  .day-date { font-size: 10px; color: var(--ink-muted); margin-top: 4px; }
  .day-precip { font-size: 10px; color: var(--ink-muted); margin-top: 6px; letter-spacing: 0.05em; }

  .rain-bar-wrap { width: 100%; height: 3px; background: rgba(0,0,0,0.1); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .rain-bar-fill { height: 100%; border-radius: 2px; background: #5a9fd4; transition: width 0.5s; }
  .day-card.active .rain-bar-wrap { background: rgba(255,255,255,0.2); }
  .day-card.active .rain-bar-fill { background: rgba(255,255,255,0.7); }

  .detail-panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    backdrop-filter: blur(12px);
    padding: 1.5rem;
    margin-bottom: 2rem;
    animation: fadeUp 0.8s ease 0.35s both;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.25rem;
  }
  .panel-day-name {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
    color: var(--ink);
  }
  .panel-tag {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .stat-block { }
  .stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
  .stat-val { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--ink); line-height: 1; }
  .stat-val sup { font-size: 0.45em; vertical-align: super; font-family: 'DM Mono', monospace; }
  .stat-unit { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }

  .chart-wrap {
    position: relative;
    width: 100%;
    height: 160px;
    margin-bottom: 0;
  }

  .footer {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-top: 1.5rem;
    animation: fadeUp 0.8s ease 0.5s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .temp-visual {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 1.25rem;
  }
  .temp-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(26,26,46,0.15), transparent);
  }
  .temp-badge {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  @media (max-width: 640px) {
    .days-row { grid-template-columns: repeat(4, 1fr); }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 420px) {
    .days-row { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Fetching forecast…</div>
</div>

<div class="sky-bg rainy" id="skyBg"></div>

<div class="clouds">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>
</div>

<div class="rain-container" id="rainContainer"></div>

<div class="app">
  <div class="header">
    <div class="location-block">
      <h1 class="city-name">Da<em>vis</em>,<br>California</h1>
      <p class="subtitle">Yolo County &nbsp;·&nbsp; 38.5°N</p>
    </div>
    <div class="current-block">
      <div class="big-temp" id="bigTemp">—<sup>°F</sup></div>
      <div class="current-cond" id="currentCond">Loading…</div>
    </div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="days-row" id="daysRow"></div>

  <div class="detail-panel" id="detailPanel"></div>

  <div class="footer" id="footer">
    Weather data for Davis, CA &nbsp;·&nbsp; National Weather Service
  </div>
</div>

<script>
// Davis, CA coordinates
const LAT = 38.5449;
const LON = -121.7405;

let forecastDays = [];
let hourlyPeriods = [];
let activeDay = 0;
let chart = null;

// --- Rain drops ---
const rainContainer = document.getElementById('rainContainer');
for (let i = 0; i < 60; i++) {
  const d = document.createElement('div');
  d.className = 'raindrop';
  d.style.cssText = `left:${Math.random()*100}%;height:${12+Math.random()*20}px;
    animation-duration:${0.6+Math.random()*0.8}s;
    animation-delay:${-Math.random()*2}s;top:${Math.random()*10-5}%`;
  rainContainer.appendChild(d);
}

// --- Helpers ---
const condIcon = cond => {
  if (!cond) return '🌤';
  const c = cond.toLowerCase();
  if (/heavy rain|heavy shower/.test(c)) return '🌧';
  if (/thunder/.test(c)) return '⛈';
  if (/shower|rain|drizzle/.test(c)) return '🌦';
  if (/mostly cloudy|overcast/.test(c)) return '🌥';
  if (/partly cloudy|partly sunny/.test(c)) return '⛅';
  if (/cloud/.test(c)) return '☁️';
  if (/clear|sunny/.test(c)) return '☀️';
  if (/snow/.test(c)) return '🌨';
  if (/fog/.test(c)) return '🌫';
  if (/wind/.test(c)) return '🌬';
  return '🌤';
};

const skyClass = cond => {
  if (!cond) return 'cloudy';
  const c = cond.toLowerCase();
  if (/rain|shower|drizzle|thunder/.test(c)) return 'rainy';
  if (/cloud|overcast/.test(c)) return 'cloudy';
  return 'clear';
};

// Parse wind speed from strings like "10 mph" or "10 to 15 mph"
const parseWind = str => {
  if (!str) return 0;
  const nums = str.match(/\d+/g);
  if (!nums) return 0;
  return nums.length > 1
    ? Math.round((parseInt(nums[0]) + parseInt(nums[1])) / 2)
    : parseInt(nums[0]);
};

// Format a date string like "Mon Apr 14"
const formatDate = isoStr => {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
};

const dayName = isoStr => {
  return new Date(isoStr).toLocaleDateString('en-US', { weekday: 'short' });
};

const monthDay = isoStr => {
  return new Date(isoStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
};

// --- Fetch from NWS ---
async function fetchWeather() {
  try {
    // Step 1: Get grid info for Davis, CA
    const pointsRes = await fetch(
      `https://api.weather.gov/points/${LAT},${LON}`,
      { headers: { 'User-Agent': 'DavisWeatherApp (davis-weather@example.com)' } }
    );
    if (!pointsRes.ok) throw new Error(`Points API error: ${pointsRes.status}`);
    const pointsData = await pointsRes.json();

    const forecastUrl      = pointsData.properties.forecast;
    const forecastHourlyUrl = pointsData.properties.forecastHourly;

    // Step 2: Fetch daily + hourly forecasts in parallel
    const [dailyRes, hourlyRes] = await Promise.all([
      fetch(forecastUrl,       { headers: { 'User-Agent': 'DavisWeatherApp (davis-weather@example.com)' } }),
      fetch(forecastHourlyUrl, { headers: { 'User-Agent': 'DavisWeatherApp (davis-weather@example.com)' } }),
    ]);
    if (!dailyRes.ok)  throw new Error(`Forecast API error: ${dailyRes.status}`);
    if (!hourlyRes.ok) throw new Error(`Hourly API error: ${hourlyRes.status}`);

    const dailyData  = await dailyRes.json();
    const hourlyData = await hourlyRes.json();

    // NWS returns day + night periods alternating. Pair them up.
    const periods = dailyData.properties.periods;
    forecastDays = [];
    for (let i = 0; i < periods.length - 1; i++) {
      const p = periods[i];
      // Only grab daytime periods as the "anchor"
      if (!p.isDaytime) continue;
      const night = periods[i + 1];
      forecastDays.push({
        day:       dayName(p.startTime),
        date:      monthDay(p.startTime),
        startTime: p.startTime,
        high:      p.temperature,
        low:       night ? night.temperature : p.temperature - 10,
        precip:    p.probabilityOfPrecipitation?.value ?? 0,
        cond:      p.shortForecast,
        wind:      parseWind(p.windSpeed),
        humidity:  p.relativeHumidity?.value ?? 50,
        detailedForecast: p.detailedForecast,
      });
      if (forecastDays.length === 7) break;
    }

    // Store hourly periods for the chart
    hourlyPeriods = hourlyData.properties.periods;

    // Update the "current" header from today's data
    if (forecastDays.length > 0) {
      const today = forecastDays[0];
      document.getElementById('bigTemp').innerHTML = `${today.high}<sup>°F</sup>`;
      document.getElementById('currentCond').textContent = today.cond;
    }

    // Update footer with last-fetched time
    const now = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    document.getElementById('footer').innerHTML =
      `Weather data for Davis, CA &nbsp;·&nbsp; National Weather Service &nbsp;·&nbsp; Updated ${now}`;

    renderAll();

  } catch (err) {
    console.error(err);
    showError(`Couldn't load forecast: ${err.message}. Showing cached data if available.`);
  } finally {
    const overlay = document.getElementById('loadingOverlay');
    overlay.classList.add('hidden');
    setTimeout(() => overlay.remove(), 600);
  }
}

function showError(msg) {
  const banner = document.getElementById('errorBanner');
  banner.textContent = msg;
  banner.classList.add('visible');
}

// --- Render ---
function renderDays() {
  const row = document.getElementById('daysRow');
  row.innerHTML = '';
  forecastDays.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'day-card' + (i === activeDay ? ' active' : '');
    card.innerHTML = `
      <div class="day-label">${d.day}</div>
      <span class="day-icon">${condIcon(d.cond)}</span>
      <div class="day-high">${d.high}<sup>°</sup></div>
      <div class="day-date">${d.date}</div>
      <div class="day-precip">${d.precip}% rain</div>
      <div class="rain-bar-wrap"><div class="rain-bar-fill" style="width:${d.precip}%"></div></div>`;
    card.onclick = () => { activeDay = i; renderAll(); };
    row.appendChild(card);
  });
}

function renderDetail() {
  if (forecastDays.length === 0) return;
  const d = forecastDays[activeDay];
  const panel = document.getElementById('detailPanel');

  // Update sky + rain
  document.getElementById('skyBg').className = 'sky-bg ' + skyClass(d.cond);
  rainContainer.classList.toggle('active', d.precip > 30);

  // Pull hourly data for this day (match by date)
  const dayStr = d.startTime.slice(0, 10); // "2025-04-14"
  const dayHours = hourlyPeriods.filter(h => h.startTime.startsWith(dayStr));

  // Pick up to 6 representative hours across the day
  const targetHours = [6, 9, 12, 15, 18, 21];
  const chartHours = targetHours.map(h => {
    const match = dayHours.find(p => new Date(p.startTime).getHours() === h);
    return match || null;
  }).filter(Boolean);

  // Fallback: simulate if hourly data not available for this day
  const hours  = chartHours.length >= 3
    ? chartHours.map(h => new Date(h.startTime).toLocaleTimeString('en-US', { hour: 'numeric' }))
    : ['6am','9am','12pm','3pm','6pm','9pm'];
  const temps  = chartHours.length >= 3
    ? chartHours.map(h => h.temperature)
    : [0.55,0.72,0.88,1.0,0.82,0.62].map(f => Math.round(d.low + (d.high - d.low) * f));
  const precips = chartHours.length >= 3
    ? chartHours.map(h => h.probabilityOfPrecipitation?.value ?? 0)
    : [0.4,0.3,0.6,0.8,0.7,0.5].map(f => Math.round(d.precip * f));

  panel.innerHTML = `
    <div class="panel-header">
      <div class="panel-day-name">${d.day}, ${d.date}</div>
      <div class="panel-tag">${d.cond}</div>
    </div>
    <div class="stats-row">
      <div class="stat-block">
        <div class="stat-label">High</div>
        <div class="stat-val">${d.high}<sup>°F</sup></div>
        <div class="stat-unit">Low ${d.low}°</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Precip</div>
        <div class="stat-val">${d.precip}<sup>%</sup></div>
        <div class="stat-unit">chance of rain</div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Wind</div>
        <div class="stat-val">${d.wind}</div>
        <div class="stat-unit">mph</div>
      </div>
    </div>
    <div class="temp-visual">
      <div class="temp-line"></div>
      <div class="temp-badge">hourly forecast</div>
      <div class="temp-line"></div>
    </div>
    <div class="chart-wrap">
      <canvas id="tempChart" role="img" aria-label="Hourly temperature forecast for ${d.day}"></canvas>
    </div>`;

  if (chart) { chart.destroy(); chart = null; }
  const ctx = document.getElementById('tempChart').getContext('2d');
  chart = new Chart(ctx, {
    data: {
      labels: hours,
      datasets: [
        {
          type: 'line',
          label: 'Temp °F',
          data: temps,
          borderColor: '#e8650a',
          backgroundColor: 'rgba(232,101,10,0.08)',
          borderWidth: 2,
          pointBackgroundColor: '#e8650a',
          pointRadius: 4,
          pointHoverRadius: 6,
          fill: true,
          tension: 0.4,
          yAxisID: 'yTemp',
        },
        {
          type: 'bar',
          label: 'Precip %',
          data: precips,
          backgroundColor: 'rgba(90,159,212,0.35)',
          borderColor: 'rgba(90,159,212,0.6)',
          borderWidth: 1,
          borderRadius: 2,
          yAxisID: 'yPrecip',
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.datasetIndex === 0 ? ` ${ctx.parsed.y}°F` : ` ${ctx.parsed.y}% rain`
          }
        }
      },
      scales: {
        x: {
          ticks: { font: { family: "'DM Mono', monospace", size: 10 }, color: '#7a7a9a' },
          grid: { color: 'rgba(0,0,0,0.06)' },
          border: { display: false }
        },
        yTemp: {
          position: 'left',
          min: d.low - 5,
          max: d.high + 8,
          ticks: { font: { family: "'DM Mono', monospace", size: 10 }, color: '#e8650a', callback: v => v + '°' },
          grid: { color: 'rgba(0,0,0,0.06)' },
          border: { display: false }
        },
        yPrecip: {
          position: 'right',
          min: 0, max: 100,
          ticks: { font: { family: "'DM Mono', monospace", size: 10 }, color: '#5a9fd4', callback: v => v + '%' },
          grid: { drawOnChartArea: false },
          border: { display: false }
        }
      }
    }
  });
}

function renderAll() {
  renderDays();
  renderDetail();
}

// Kick it off
fetchWeather();
